name: Mise a jour Slafkovsky

on:
  schedule:
    - cron: "0 5,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger le journal de matchs
        run: |
          curl -sSf -A "Mozilla/5.0" "https://api-web.nhle.com/v1/player/8483515/game-log/20262027/2" -o raw.json
          jq '[.gameLog | sort_by(.gameDate)[] | .points]' raw.json > current.json
          rm raw.json
          cat current.json

      - name: Enregistrer si changement
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add current.json
          if ! git diff --staged --quiet; then
            git commit -m "Mise a jour des points"
            git push
          fi
